<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Command menu: states</title>
    <script type="module" src="../../site/specimen.ts"></script>
  </head>
  <body class="cap-specimens">
    <main>
      <h1>Command menu</h1>
      <p>Every view, action and shortcut in one searchable list. Each specimen is a page of its own with the same sample commands. Sample data.</p>

      <template data-specimen="closed" data-title="Closed, with its button (Ctrl K and / open it)" data-height="300">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p><button type="button" class="cap-btn" data-cap-command-open>Commands <kbd>Ctrl K</kbd></button></p>
          <p role="status" data-specimen-part="said"></p>
        </main>
      </template>

      <template data-specimen="open" data-title="Open, every group" data-height="760">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p role="status" data-specimen-part="said"></p>
        </main>
      </template>

      <template data-specimen="filtered" data-title="Filtered by what is typed" data-height="440">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p role="status" data-specimen-part="said"></p>
        </main>
      </template>

      <template data-specimen="stops" data-title="Typing stop lists every stop, each saying what it asks" data-height="440">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p role="status" data-specimen-part="said"></p>
        </main>
      </template>

      <template data-specimen="nomatch" data-title="No match" data-height="360">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p role="status" data-specimen-part="said"></p>
        </main>
      </template>

      <template data-specimen="active" data-title="An option made active with the arrow keys" data-height="760">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p role="status" data-specimen-part="said"></p>
        </main>
      </template>
    </main>
    <script type="module">
      import { createCommandMenu, enhance, openCommandMenu, stopCommand } from "./command-menu.ts";
      const only = new URLSearchParams(location.search).get("only");
      if (only) {
        const said = document.querySelector("[data-specimen-part='said']");
        const ran = (label) => () => {
          if (said) said.textContent = `Ran: ${label}`;
        };
        const c = (id, label, group, shortcut, keywords) => ({ id, label, group, shortcut, keywords, run: ran(label) });
        const menu = createCommandMenu([
          c("go-overview", "Overview", "Go to", "g o", ["home", "dashboard"]),
          c("go-sites", "Sites", "Go to", "g s", ["uptime", "checks"]),
          c("go-queue", "Queue", "Go to", "g q", ["jobs", "blocked"]),
          // A stop opens its control (a reason field, the confirm dialog); it never performs.
          stopCommand({ id: "stop-ns", label: "Pause capsomer", ask: "reason", run: ran("Pause capsomer opens its reason field") }),
          stopCommand({ id: "stop-agent", label: "Revoke foxhound-driver", ask: "preview", keywords: ["revoke"], run: ran("Revoke foxhound-driver opens its preview") }),
          c("refresh", "Refresh now", "Actions", "r", ["reload"]),
          c("theme", "Switch light and dark", "Actions", "t", ["theme", "dark mode"]),
          c("copy-cmd", "Copy the command for the blocked capsomer job", "Copy", undefined, ["git push"]),
          c("help", "Show keyboard shortcuts", "Help", "?", ["keys", "help"]),
        ]);
        enhance();
        if (only === "open") openCommandMenu();
        if (only === "filtered") openCommandMenu("ck");
        if (only === "stops") openCommandMenu("stop");
        if (only === "nomatch") openCommandMenu("deploy to vercel");
        if (only === "active") {
          openCommandMenu();
          menu.setActive(2);
        }
      }
    </script>
  </body>
</html>
