<section class="cap-specimen" aria-labelledby="s-shown">
  <h2 id="s-shown">As the server renders it, with each link going to its field</h2>
  <form class="cap-field-options" id="es-static" method="post" action="#saved" aria-labelledby="s-shown">
    <div class="cap-error-summary" data-cap="error-summary" tabindex="-1" role="alert" aria-labelledby="es-static-t">
      <h3 class="cap-error-summary-title" id="es-static-t">There is a problem</h3>
      <ul class="cap-error-summary-list">
        <li><a href="#es-name">Give the job a name, such as Nightly backup.</a></li>
        <li><a href="#es-every-1">Choose how often it runs.</a></li>
      </ul>
    </div>
    <div class="cap-field" data-invalid="true">
      <label class="cap-field-label" for="es-name">Job name</label>
      <input class="cap-input" id="es-name" name="name" aria-invalid="true" aria-describedby="es-name-e" autocomplete="off" />
      <p class="cap-field-error" id="es-name-e">Give the job a name, such as Nightly backup.</p>
    </div>
    <fieldset class="cap-field" data-invalid="true">
      <legend class="cap-field-label">Runs every</legend>
      <div class="cap-field-options">
        <label class="cap-check"><input type="radio" name="every" id="es-every-1" value="hour" aria-invalid="true" aria-describedby="es-every-e" /> Hour</label>
        <label class="cap-check"><input type="radio" name="every" value="day" aria-invalid="true" aria-describedby="es-every-e" /> Day</label>
      </div>
      <p class="cap-field-error" id="es-every-e">Choose how often it runs.</p>
    </fieldset>
  </form>
</section>

<section class="cap-specimen" aria-labelledby="s-live">
  <h2 id="s-live">A live form: send it empty</h2>
  <form class="cap-field-options" id="es-live" data-cap="field" action="#added" aria-labelledby="s-live">
    <div class="cap-field">
      <label class="cap-field-label" for="es-site">Site name <span class="cap-field-required" aria-hidden="true">Required</span></label>
      <input class="cap-input" id="es-site" name="site" required autocomplete="off" aria-describedby="es-site-e" data-error-value-missing="Give the site a name, such as Field notes." />
      <p class="cap-field-error" id="es-site-e" hidden></p>
    </div>
    <div class="cap-field">
      <label class="cap-field-label" for="es-email">Owner's email <span class="cap-field-required" aria-hidden="true">Required</span></label>
      <input class="cap-input" id="es-email" name="email" type="email" required autocomplete="email" spellcheck="false" aria-describedby="es-email-e" data-error-value-missing="Enter the owner's email, such as maya.chen@example.edu." data-error-type-mismatch="Enter an email address with an @, such as maya.chen@example.edu." />
      <p class="cap-field-error" id="es-email-e" hidden></p>
    </div>
    <div><button type="submit" class="cap-btn" data-variant="primary">Add site</button></div>
    <p class="cap-muted" id="es-result"></p>
  </form>
</section>

<script type="module">
  import { enhance as enhanceFields } from "../field/field.ts";
  import { enhance } from "./error-summary.ts";
  enhance();
  enhanceFields();
  document.querySelector("#es-live")?.addEventListener("submit", (e) => {
    e.preventDefault();
    document.querySelector("#es-result").textContent = "Added the site.";
  });
</script>
