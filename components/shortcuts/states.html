<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortcuts: states</title>
    <script type="module" src="../../site/specimen.ts"></script>
  </head>
  <body class="cap-specimens">
    <main>
      <h1>Shortcuts</h1>
      <p>One registry for every keyboard shortcut, and the sheet that <kbd>?</kbd> opens. Each specimen is a page of its own, with the same sample shortcuts registered. Sample data.</p>

      <template data-specimen="page" data-title="Working: press ? or g then o" data-height="360">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p>Press <kbd>?</kbd> for the sheet, <kbd>g</kbd> then <kbd>o</kbd> to go to Overview, <kbd>r</kbd> to refresh. Keys typed into the field below are left alone.</p>
          <p><button type="button" class="cap-btn" data-cap-keys-open>Keyboard shortcuts</button></p>
          <p><label for="note">A note</label> <input id="note" class="cap-input" type="text" autocomplete="off" /></p>
          <p role="status" data-specimen-part="said"></p>
        </main>
      </template>

      <template data-specimen="open" data-title="The sheet, open" data-height="560">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p>The page behind the sheet.</p>
        </main>
        <dialog class="cap-keys" data-cap="shortcuts" aria-labelledby="keys-title">
          <div class="cap-keys-head">
            <h2 class="cap-keys-title" id="keys-title">Keyboard shortcuts</h2>
            <button type="button" class="cap-btn" data-cap-part="close">Close</button>
          </div>
          <div class="cap-keys-body" data-cap-part="keys-list"></div>
          <div class="cap-keys-foot">
            <label class="cap-switch"><input type="checkbox" role="switch" data-cap-part="single-keys" aria-describedby="keys-note" checked /><span>Single-key shortcuts</span><span class="cap-switch-state" aria-hidden="true">On</span></label>
            <p class="cap-keys-note" id="keys-note">Turn these off if they clash with a screen reader or speech input. Shortcuts with Ctrl or ⌘ keep working.</p>
          </div>
        </dialog>
      </template>

      <template data-specimen="off" data-title="The sheet, single-key shortcuts off" data-height="560">
        <main class="specimen-page" tabindex="-1">
          <h1>Overview</h1>
          <p>The page behind the sheet.</p>
        </main>
        <dialog class="cap-keys" data-cap="shortcuts" aria-labelledby="off-title">
          <div class="cap-keys-head">
            <h2 class="cap-keys-title" id="off-title">Keyboard shortcuts</h2>
            <button type="button" class="cap-btn" data-cap-part="close">Close</button>
          </div>
          <div class="cap-keys-body" data-cap-part="keys-list"></div>
          <div class="cap-keys-foot">
            <label class="cap-switch"><input type="checkbox" role="switch" data-cap-part="single-keys" aria-describedby="off-note" /><span>Single-key shortcuts</span><span class="cap-switch-state" aria-hidden="true">Off</span></label>
            <p class="cap-keys-note" id="off-note">Turn these off if they clash with a screen reader or speech input. Shortcuts with Ctrl or ⌘ keep working.</p>
          </div>
        </dialog>
      </template>
    </main>
    <script type="module">
      import { enhance, openShortcutSheet, register, setSingleKeys } from "./shortcuts.ts";
      const only = new URLSearchParams(location.search).get("only");
      if (only) {
        const said = document.querySelector("[data-specimen-part='said']");
        const say = (text) => () => {
          if (said) said.textContent = text;
        };
        register({ key: "Mod+k", label: "Open the command menu", group: "General", run: say("The command menu opens here.") });
        register({ key: "g o", label: "Go to Overview", group: "Go to", run: say("Went to Overview.") });
        register({ key: "g s", label: "Go to Sites", group: "Go to", run: say("Went to Sites.") });
        register({ key: "g q", label: "Go to Queue", group: "Go to", run: say("Went to Queue.") });
        register({ key: "r", label: "Refresh now", group: "Actions", run: say("Refreshed.") });
        register({ key: "t", label: "Switch light and dark", group: "Actions", run: say("Switched the theme.") });
        register({ key: "[", label: "Collapse or expand the side menu", group: "Actions", run: say("Collapsed the side menu.") });
        if (only === "off") setSingleKeys(false, { remember: false });
        enhance();
        if (only === "open" || only === "off") openShortcutSheet(null);
      }
    </script>
  </body>
</html>
