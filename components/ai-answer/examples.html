<section class="cap-specimen" aria-labelledby="s-done">
  <h2 id="s-done">Answered, with sources and a follow-up</h2>
  <div class="cap-specimen-row" data-specimen-part="done"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-looking">
  <h2 id="s-looking">Looking it up</h2>
  <div class="cap-specimen-row" data-specimen-part="looking"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-cut">
  <h2 id="s-cut">Cut off</h2>
  <div class="cap-specimen-row" data-specimen-part="cut"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-failed">
  <h2 id="s-failed">Failed</h2>
  <div class="cap-specimen-row" data-specimen-part="failed"></div>
</section>

<script type="module">
  import { buildAnswer } from "./ai-answer.ts";
  const at = (name) => document.querySelector(`[data-specimen-part='${name}']`);
  const sources = [
    { href: "/notes/field-notes", title: "Field notes" },
    { href: "/notes/spring-update#plots", title: "Spring update", kind: "section" },
  ];
  const done = buildAnswer();
  done.write("Field notes are kept for each spring survey, one page per plot.");
  done.setSources(sources);
  done.setFollowUp("How are the plots chosen?", "/search?q=plots");
  done.finish();
  at("done").append(done.el);
  at("looking").append(buildAnswer().el);
  const cut = buildAnswer();
  cut.write("The annual report covers the year's surveys and");
  cut.markCut();
  cut.setSources(sources.slice(0, 1));
  cut.finish();
  at("cut").append(cut.el);
  const failed = buildAnswer();
  failed.fail("Answers are unavailable.");
  at("failed").append(failed.el);
</script>
