<link rel="stylesheet" href="./specimen/layout.css" />

<section class="cap-specimen" aria-labelledby="s-program">
  <h2 id="s-program">A whole program: two days, parallel tracks, and sessions not yet dated</h2>
  <div data-mount="program"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-day">
  <h2 id="s-day">One day at a time, from the day nav, with a field to add a day</h2>
  <div data-mount="day"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-zone">
  <h2 id="s-zone">In the meeting's own zone</h2>
  <div data-mount="zone"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-empty">
  <h2 id="s-empty">A day with nothing on it yet</h2>
  <div data-mount="empty"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-narrow">
  <h2 id="s-narrow">Phone width: the tracks stack, in order</h2>
  <div class="schedule-narrow" data-mount="narrow"></div>
</section>
