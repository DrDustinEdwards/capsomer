<script type="module">
  import { confirm, enhance, openConfirm } from "./confirm-dialog.ts";
  enhance();
  for (const d of document.querySelectorAll("dialog[data-specimen-open]")) openConfirm(d, null);

  // The working specimen. The action waits until the page (or a test) says how it ends:
  // window.capRelease() finishes it, window.capFail() fails it.
  const said = document.querySelector("[data-specimen-part='said']");
  const wait = (onDone) =>
    new Promise((resolve, reject) => {
      window.capRelease = () => {
        onDone();
        resolve();
      };
      window.capFail = () => reject(new Error("The server did not answer in 10 seconds. Check Activity, then try again."));
    });
  document.querySelector("[data-specimen-action='revoke']")?.addEventListener("click", async (e) => {
    const row = e.currentTarget.closest("li");
    const done = await confirm({
      title: "Revoke foxhound-driver?",
      lead: "This cannot be undone. The agent stops working at once.",
      body: ["Its key stops being accepted.", "Its 1 claimed job goes back to the queue.", "An audit row records the revocation under your name."],
      action: "Revoke agent",
      perform: () => wait(() => row?.remove()),
    });
    if (said) said.textContent = done ? "Revoked foxhound-driver." : "Nothing changed.";
  });
  document.querySelector("[data-specimen-action='fail']")?.addEventListener("click", async () => {
    let given = "";
    const done = await confirm({
      title: "Mark job failed: Rotate the watcher's Cloudflare token",
      lead: "This ends the job. It cannot be resumed.",
      body: ["The job's status becomes failed.", "An audit row records the change and your reason."],
      action: "Mark failed",
      reason: {},
      perform: (why) => wait(() => (given = why)),
    });
    if (said) said.textContent = done ? `Marked failed: ${given}` : "Nothing changed.";
  });
  document.querySelector("[data-specimen-action='delete']")?.addEventListener("click", async () => {
    const done = await confirm({
      title: "Delete the germomics.org record?",
      lead: "This cannot be recovered. There is no backup of a site record.",
      body: ["Its 7 days of uptime history are deleted.", "The watcher stops checking germomics.org on its next pass.", "An audit row records the deletion under your name."],
      action: "Delete record",
      typeToConfirm: "delete",
      perform: () => wait(() => undefined),
    });
    if (said) said.textContent = done ? "Deleted the germomics.org record." : "Nothing changed.";
  });
</script>
