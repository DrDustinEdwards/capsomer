<section class="cap-specimen" aria-labelledby="s-states">
  <h2 id="s-states">States</h2>
  <div class="cap-specimen-row">
    <div class="cap-like" id="lk-off"><button type="button" class="cap-like-button" aria-pressed="false"><svg class="cap-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7.5 4.5 4.5 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg><span class="cap-sr-only">Like Field notes, </span><span>12</span></button></div>
    <div class="cap-like" id="lk-on"><button type="button" class="cap-like-button" aria-pressed="true"><svg class="cap-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7.5 4.5 4.5 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg><span class="cap-sr-only">Like Field notes, </span><span>13</span></button></div>
    <div class="cap-like" id="lk-hover"><button type="button" class="cap-like-button" aria-pressed="false" data-force="hover"><svg class="cap-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7.5 4.5 4.5 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg><span class="cap-sr-only">Like Field notes, </span><span>12</span></button></div>
    <div class="cap-like" id="lk-signed-out"><button type="button" class="cap-like-button" aria-pressed="false" disabled><svg class="cap-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7.5 4.5 4.5 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg><span class="cap-sr-only">Like Field notes, </span><span>12</span></button></div>
    <div class="cap-like" id="lk-saving"><button type="button" class="cap-like-button" aria-pressed="true" aria-busy="true" aria-disabled="true"><svg class="cap-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7.5 4.5 4.5 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg><span class="cap-sr-only">Like Field notes, </span><span>13</span></button></div>
    <div class="cap-like" id="lk-failed"><button type="button" class="cap-like-button" aria-pressed="false"><svg class="cap-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7.5 4.5 4.5 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg><span class="cap-sr-only">Like Field notes, </span><span>12</span></button><p class="cap-like-error" role="alert">That did not save. Try again.</p></div>
  </div>
</section>

<script type="module">
  for (const button of document.querySelectorAll("#lk-off .cap-like-button, #lk-on .cap-like-button")) {
    button.addEventListener("click", () => {
      const on = button.getAttribute("aria-pressed") !== "true";
      button.setAttribute("aria-pressed", String(on));
      const n = button.lastElementChild;
      n.textContent = String(Number(n.textContent) + (on ? 1 : -1));
    });
  }
</script>
