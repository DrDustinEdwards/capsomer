<section class="cap-specimen" aria-labelledby="s-closed">
  <h2 id="s-closed">Closed</h2>

</section>

<section class="cap-specimen" aria-labelledby="s-chosen">
  <h2 id="s-chosen">Closed, with a value chosen</h2>
  <div data-mount="chosen"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-disabled">

  <div data-mount="disabled"></div>
</section>
