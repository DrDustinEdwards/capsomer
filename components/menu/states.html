<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu: states</title>
    <script type="module" src="../../site/specimen.ts"></script>
  </head>
  <body class="cap-specimens">
    <main>
      <h1>Menu</h1>
      <p>A button that opens a list of actions. Built on Base UI. The specimens are React, mounted by states.tsx; each open state has its own frame. Sample data.</p>

      <section class="cap-specimen" aria-labelledby="s-closed">
        <h2 id="s-closed">Closed</h2>
        <div data-mount="closed"></div>
      </section>

      <template data-specimen="open" data-title="Open" data-height="300">
        <main class="specimen-page"><div data-mount="open"></div></main>
      </template>

      <template data-specimen="highlighted" data-title="An item highlighted" data-height="300">
        <main class="specimen-page"><div data-mount="highlighted"></div></main>
      </template>

      <template data-specimen="disabled" data-title="A disabled item with its reason" data-height="300">
        <main class="specimen-page"><div data-mount="disabled"></div></main>
      </template>

      <template data-specimen="danger" data-title="A danger item, last, after a separator" data-height="320">
        <main class="specimen-page"><div data-mount="danger"></div></main>
      </template>
    </main>
    <script type="module" src="./states.tsx"></script>
  </body>
</html>
