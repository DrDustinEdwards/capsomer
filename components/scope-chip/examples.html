<section class="cap-specimen" aria-labelledby="s-all">
  <h2 id="s-all">Every site</h2>
  <form method="get" action="#scope" class="cap-scope" data-cap="scope-chip" id="scope-all">
    <input type="hidden" name="status" value="draft" />
    <label class="cap-scope-label">
      <span class="cap-sr-only">Show posts from</span>
      <select class="cap-select" name="site"><option value="">All sites</option><option value="example-org">example.org</option><option value="example-net">example.net</option></select>
    </label>
    <button class="cap-btn cap-scope-submit" type="submit">Show</button>
  </form>
</section>

<section class="cap-specimen" aria-labelledby="s-one">
  <h2 id="s-one">One scope required (no unscoped choice)</h2>
  <form method="get" action="#scope" class="cap-scope" data-cap="scope-chip" id="scope-one">
    <label class="cap-scope-label">
      <span class="cap-sr-only">Show media from</span>
      <select class="cap-select" name="site"><option value="example-org" selected>example.org</option><option value="example-net">example.net</option></select>
    </label>
    <button class="cap-btn cap-scope-submit" type="submit">Show</button>
  </form>
</section>

<section class="cap-specimen" aria-labelledby="s-noscript">
  <h2 id="s-noscript">With no script: the Show button</h2>
  <form method="get" action="#scope" class="cap-scope" id="scope-noscript">
    <label class="cap-scope-label">
      <span class="cap-sr-only">Show mentions from</span>
      <select class="cap-select" name="site"><option value="">All sites</option><option value="example-org">example.org</option><option value="example-net">example.net</option></select>
    </label>
    <button class="cap-btn cap-scope-submit" type="submit">Show</button>
  </form>
</section>

<script type="module">
  import { enhance } from "./scope-chip.ts";
  enhance();
</script>
