<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approval sheet: states</title>
    <script type="module" src="../../site/specimen.ts"></script>
  </head>
  <body class="cap-specimens">
    <main>
      <h1>Approval sheet</h1>
      <p>Several waiting gates approved together in one sheet. Each specimen opens the sheet in its own frame; Cancel or Esc closes it and the button behind it opens it again. Sample data.</p>

      <template data-specimen="two" data-title="Open, with two gates" data-height="640">
        <main class="specimen-page">
          <h1>Queue</h1>
          <p>2 gates are waiting for approval.</p>
          <p><button type="button" class="cap-btn" data-cap-opens="ap-two">Review 2 gates</button></p>
        </main>
        <dialog class="cap-approval" data-cap="approval-sheet" id="ap-two" aria-labelledby="ap-two-title" data-specimen-open>
          <form class="cap-approval-form">
            <div class="cap-approval-head">
              <h2 class="cap-approval-title" id="ap-two-title">2 gates are waiting</h2>
              <p class="cap-approval-lead">Each command runs once, when approved. Uncheck a gate you are not ready for; it stays waiting.</p>
            </div>
            <div class="cap-approval-gates">
              <fieldset class="cap-approval-gate">
                <legend class="cap-approval-job">Deploy foxhound to production</legend>
                <p class="cap-approval-meta">job_8c21 in foxhound, waiting 26 minutes</p>
                <pre class="cap-approval-cmd"><code>npx wrangler deploy --env production --var RELEASE:a91c4e0</code></pre>
                <label class="cap-check"><input type="checkbox" data-cap-part="include" name="gate" value="job_8c21" checked /> Include this gate</label>
                <div class="cap-field"><label class="cap-field-label" for="ap-two-c1">Comment (optional)</label><textarea class="cap-input" id="ap-two-c1" data-cap-part="comment" rows="2"></textarea></div>
              </fieldset>
              <fieldset class="cap-approval-gate">
                <legend class="cap-approval-job">Run the Carrel migration 0008</legend>
                <p class="cap-approval-meta">job_41fe in carrel, waiting 9 minutes</p>
                <pre class="cap-approval-cmd"><code>npx wrangler d1 migrations apply carrel-db --remote</code></pre>
                <label class="cap-check"><input type="checkbox" data-cap-part="include" name="gate" value="job_41fe" checked /> Include this gate</label>
                <div class="cap-field"><label class="cap-field-label" for="ap-two-c2">Comment (optional)</label><textarea class="cap-input" id="ap-two-c2" data-cap-part="comment" rows="2"></textarea></div>
              </fieldset>
            </div>
            <div class="cap-approval-error" data-cap-part="error" hidden>
              <div class="cap-alert" data-tone="crit" role="alert"><span data-cap-part="error-text"></span></div>
            </div>
            <div class="cap-approval-foot">
              <button type="button" class="cap-btn" data-cap-part="cancel" autofocus>Cancel</button>
              <p class="cap-approval-none" id="ap-two-none" data-cap-part="none" hidden>Choose at least one gate.</p>
              <button type="submit" class="cap-btn" data-variant="primary" data-cap-part="approve"><span data-cap-part="approve-label">Approve 2 gates</span></button>
            </div>
          </form>
        </dialog>
      </template>

      <template data-specimen="one-unchecked" data-title="One gate unchecked" data-height="640">
        <main class="specimen-page">
          <h1>Queue</h1>
          <p>2 gates are waiting for approval.</p>
          <p><button type="button" class="cap-btn" data-cap-opens="ap-one">Review 2 gates</button></p>
        </main>
        <dialog class="cap-approval" data-cap="approval-sheet" id="ap-one" aria-labelledby="ap-one-title" data-specimen-open>
          <form class="cap-approval-form">
            <div class="cap-approval-head">
              <h2 class="cap-approval-title" id="ap-one-title">2 gates are waiting</h2>
              <p class="cap-approval-lead">Each command runs once, when approved. Uncheck a gate you are not ready for; it stays waiting.</p>
            </div>
            <div class="cap-approval-gates">
              <fieldset class="cap-approval-gate">
                <legend class="cap-approval-job">Deploy foxhound to production</legend>
                <p class="cap-approval-meta">job_8c21 in foxhound, waiting 26 minutes</p>
                <pre class="cap-approval-cmd"><code>npx wrangler deploy --env production --var RELEASE:a91c4e0</code></pre>
                <label class="cap-check"><input type="checkbox" data-cap-part="include" name="gate" value="job_8c21" checked /> Include this gate</label>
                <div class="cap-field"><label class="cap-field-label" for="ap-one-c1">Comment (optional)</label><textarea class="cap-input" id="ap-one-c1" data-cap-part="comment" rows="2">Checked the preview at a91c4e0.</textarea></div>
              </fieldset>
              <fieldset class="cap-approval-gate">
                <legend class="cap-approval-job">Run the Carrel migration 0008</legend>
                <p class="cap-approval-meta">job_41fe in carrel, waiting 9 minutes</p>
                <pre class="cap-approval-cmd"><code>npx wrangler d1 migrations apply carrel-db --remote</code></pre>
                <label class="cap-check"><input type="checkbox" data-cap-part="include" name="gate" value="job_41fe" /> Include this gate</label>
                <div class="cap-field"><label class="cap-field-label" for="ap-one-c2">Comment (optional)</label><textarea class="cap-input" id="ap-one-c2" data-cap-part="comment" rows="2"></textarea></div>
              </fieldset>
            </div>
            <div class="cap-approval-error" data-cap-part="error" hidden>
              <div class="cap-alert" data-tone="crit" role="alert"><span data-cap-part="error-text"></span></div>
            </div>
            <div class="cap-approval-foot">
              <button type="button" class="cap-btn" data-cap-part="cancel" autofocus>Cancel</button>
              <p class="cap-approval-none" id="ap-one-none" data-cap-part="none" hidden>Choose at least one gate.</p>
              <button type="submit" class="cap-btn" data-variant="primary" data-cap-part="approve"><span data-cap-part="approve-label">Approve 1 gate</span></button>
            </div>
          </form>
        </dialog>
      </template>

      <template data-specimen="pending" data-title="Pending: the approval is in flight" data-height="640">
        <main class="specimen-page">
          <h1>Queue</h1>
          <p>2 gates are waiting for approval.</p>
          <p><button type="button" class="cap-btn" data-cap-opens="ap-pend">Review 2 gates</button></p>
        </main>
        <dialog class="cap-approval" data-cap="approval-sheet" id="ap-pend" aria-labelledby="ap-pend-title" data-specimen-open>
          <form class="cap-approval-form">
            <div class="cap-approval-head">
              <h2 class="cap-approval-title" id="ap-pend-title">2 gates are waiting</h2>
              <p class="cap-approval-lead">Each command runs once, when approved. Uncheck a gate you are not ready for; it stays waiting.</p>
            </div>
            <div class="cap-approval-gates">
              <fieldset class="cap-approval-gate" disabled>
                <legend class="cap-approval-job">Deploy foxhound to production</legend>
                <p class="cap-approval-meta">job_8c21 in foxhound, waiting 26 minutes</p>
                <pre class="cap-approval-cmd"><code>npx wrangler deploy --env production --var RELEASE:a91c4e0</code></pre>
                <label class="cap-check"><input type="checkbox" data-cap-part="include" name="gate" value="job_8c21" checked /> Include this gate</label>
                <div class="cap-field"><label class="cap-field-label" for="ap-pend-c1">Comment (optional)</label><textarea class="cap-input" id="ap-pend-c1" data-cap-part="comment" rows="2"></textarea></div>
              </fieldset>
              <fieldset class="cap-approval-gate" disabled>
                <legend class="cap-approval-job">Run the Carrel migration 0008</legend>
                <p class="cap-approval-meta">job_41fe in carrel, waiting 9 minutes</p>
                <pre class="cap-approval-cmd"><code>npx wrangler d1 migrations apply carrel-db --remote</code></pre>
                <label class="cap-check"><input type="checkbox" data-cap-part="include" name="gate" value="job_41fe" checked /> Include this gate</label>
                <div class="cap-field"><label class="cap-field-label" for="ap-pend-c2">Comment (optional)</label><textarea class="cap-input" id="ap-pend-c2" data-cap-part="comment" rows="2"></textarea></div>
              </fieldset>
            </div>
            <div class="cap-approval-error" data-cap-part="error" hidden>
              <div class="cap-alert" data-tone="crit" role="alert"><span data-cap-part="error-text"></span></div>
            </div>
            <div class="cap-approval-foot">
              <button type="button" class="cap-btn" data-cap-part="cancel" aria-disabled="true" autofocus>Cancel</button>
              <p class="cap-approval-none" id="ap-pend-none" data-cap-part="none" hidden>Choose at least one gate.</p>
              <button type="submit" class="cap-btn" data-variant="primary" data-cap-part="approve" aria-busy="true"><span class="cap-btn-spinner" aria-hidden="true"></span><span data-cap-part="approve-label">Approving 2 gates</span></button>
            </div>
          </form>
        </dialog>
      </template>

      <template data-specimen="error" data-title="Error: the approval failed" data-height="680">
        <main class="specimen-page">
          <h1>Queue</h1>
          <p>2 gates are waiting for approval.</p>
          <p><button type="button" class="cap-btn" data-cap-opens="ap-err">Review 2 gates</button></p>
        </main>
        <dialog class="cap-approval" data-cap="approval-sheet" id="ap-err" aria-labelledby="ap-err-title" data-specimen-open>
          <form class="cap-approval-form">
            <div class="cap-approval-head">
              <h2 class="cap-approval-title" id="ap-err-title">2 gates are waiting</h2>
              <p class="cap-approval-lead">Each command runs once, when approved. Uncheck a gate you are not ready for; it stays waiting.</p>
            </div>
            <div class="cap-approval-gates">
              <fieldset class="cap-approval-gate">
                <legend class="cap-approval-job">Deploy foxhound to production</legend>
                <p class="cap-approval-meta">job_8c21 in foxhound, waiting 27 minutes</p>
                <pre class="cap-approval-cmd"><code>npx wrangler deploy --env production --var RELEASE:a91c4e0</code></pre>
                <label class="cap-check"><input type="checkbox" data-cap-part="include" name="gate" value="job_8c21" checked /> Include this gate</label>
                <div class="cap-field"><label class="cap-field-label" for="ap-err-c1">Comment (optional)</label><textarea class="cap-input" id="ap-err-c1" data-cap-part="comment" rows="2"></textarea></div>
              </fieldset>
              <fieldset class="cap-approval-gate">
                <legend class="cap-approval-job">Run the Carrel migration 0008</legend>
                <p class="cap-approval-meta">job_41fe in carrel, waiting 10 minutes</p>
                <pre class="cap-approval-cmd"><code>npx wrangler d1 migrations apply carrel-db --remote</code></pre>
                <label class="cap-check"><input type="checkbox" data-cap-part="include" name="gate" value="job_41fe" checked /> Include this gate</label>
                <div class="cap-field"><label class="cap-field-label" for="ap-err-c2">Comment (optional)</label><textarea class="cap-input" id="ap-err-c2" data-cap-part="comment" rows="2"></textarea></div>
              </fieldset>
            </div>
            <div class="cap-approval-error" data-cap-part="error">
              <div class="cap-alert" data-tone="crit" role="alert"><span data-cap-part="error-text">Could not approve: the queue did not answer in 10 seconds. Nothing was approved. Try again.</span></div>
            </div>
            <div class="cap-approval-foot">
              <button type="button" class="cap-btn" data-cap-part="cancel" autofocus>Cancel</button>
              <p class="cap-approval-none" id="ap-err-none" data-cap-part="none" hidden>Choose at least one gate.</p>
              <button type="submit" class="cap-btn" data-variant="primary" data-cap-part="approve"><span data-cap-part="approve-label">Approve 2 gates</span></button>
            </div>
          </form>
        </dialog>
      </template>
    </main>
    <script type="module">
      import { enhance, open, setPending } from "./approval-sheet.ts";
      enhance();
      // A page-level specimen opens its sheet on load, as if its button had been pressed.
      for (const dialog of document.querySelectorAll("dialog[data-specimen-open]")) {
        open(dialog, document.querySelector(`[data-cap-opens="${dialog.id}"]`));
      }
      // The specimen's stand-in for an app: an approval goes in flight and stays there.
      document.addEventListener("cap-approve", (e) => {
        if (e.target instanceof HTMLDialogElement) setPending(e.target, true);
      });
    </script>
  </body>
</html>
