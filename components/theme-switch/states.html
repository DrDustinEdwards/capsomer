<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme switch: states</title>
    <script type="module" src="../../site/specimen.ts"></script>
  </head>
  <body class="cap-specimens">
    <main>
      <h1>Theme switch</h1>
      <p>System, Light or Dark, remembered in this browser. Each specimen is a page of its own, because the switch sets the theme of the whole page. Press <kbd>t</kbd> in one to switch light and dark. Sample data.</p>

      <template data-specimen="system" data-title="System selected" data-height="200">
        <main class="specimen-page" tabindex="-1">
          <h1>Settings</h1>
          <fieldset class="cap-seg cap-theme" data-cap="theme-switch" data-cap-pref="cap-theme-specimen-system">
            <legend class="cap-sr-only">Theme</legend>
            <label><input type="radio" name="theme" value="system" checked />System</label>
            <label><input type="radio" name="theme" value="light" />Light</label>
            <label><input type="radio" name="theme" value="dark" />Dark</label>
          </fieldset>
          <p>Follows the operating system's setting.</p>
        </main>
      </template>

      <template data-specimen="light" data-title="Light selected" data-height="200">
        <main class="specimen-page" tabindex="-1">
          <h1>Settings</h1>
          <fieldset class="cap-seg cap-theme" data-cap="theme-switch" data-cap-pref="cap-theme-specimen-light">
            <legend class="cap-sr-only">Theme</legend>
            <label><input type="radio" name="theme" value="system" />System</label>
            <label><input type="radio" name="theme" value="light" checked />Light</label>
            <label><input type="radio" name="theme" value="dark" />Dark</label>
          </fieldset>
          <p>Light, whatever the operating system says.</p>
        </main>
      </template>

      <template data-specimen="dark" data-title="Dark selected" data-height="200">
        <main class="specimen-page" tabindex="-1">
          <h1>Settings</h1>
          <fieldset class="cap-seg cap-theme" data-cap="theme-switch" data-cap-pref="cap-theme-specimen-dark">
            <legend class="cap-sr-only">Theme</legend>
            <label><input type="radio" name="theme" value="system" />System</label>
            <label><input type="radio" name="theme" value="light" />Light</label>
            <label><input type="radio" name="theme" value="dark" checked />Dark</label>
          </fieldset>
          <p>Dark, whatever the operating system says.</p>
        </main>
      </template>
    </main>
    <script type="module">
      import { enhance, toggleTheme } from "./theme-switch.ts";
      import { register } from "../shortcuts/shortcuts.ts";
      if (new URLSearchParams(location.search).get("only")) {
        enhance();
        const key = document.querySelector("[data-cap='theme-switch']")?.dataset.capPref;
        register({ key: "t", label: "Switch light and dark", group: "Actions", run: () => toggleTheme(key) });
      }
    </script>
  </body>
</html>
