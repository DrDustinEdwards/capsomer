<script type="module">
  import { closeDialog, enhance, setDialogBusy } from "./dialog.ts";

  enhance(document);

  // The specimens' own buttons: Save closes with a line said on the page; Publish starts a
  // request that runs until Finish answers it.
  document.addEventListener("click", (e) => {
    const b = e.target instanceof Element ? e.target.closest("[data-specimen-action]") : null;
    const d = b?.closest("dialog");
    if (!b || !d || b.getAttribute("aria-disabled") === "true") return;
    const act = b.dataset.specimenAction;
    if (act === "start") {
      setDialogBusy(d, true);
      b.setAttribute("aria-busy", "true");
      b.setAttribute("aria-disabled", "true");
    } else if (act === "finish") {
      setDialogBusy(d, false);
      const go = d.querySelector("[data-specimen-action='start']");
      go?.removeAttribute("aria-busy");
      go?.removeAttribute("aria-disabled");
      closeDialog(d, "done");
    } else if (act === "save") {
      const said = document.querySelector("[data-specimen-part='said']");
      if (said) said.textContent = "Done.";
      closeDialog(d, "save");
    }
  });
</script>
