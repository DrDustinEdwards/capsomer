<link rel="stylesheet" href="./specimen/layout.css" />

<section class="cap-specimen" aria-labelledby="s-archive">
  <h2 id="s-archive">Every category: one cut short with a link to the rest, one with nothing yet</h2>
  <div data-mount="archive"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-list">
  <h2 id="s-list">One category's list</h2>
  <div data-mount="list"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-page">
  <h2 id="s-page">A document's page: download, viewer, Previous and Next</h2>
  <div data-mount="page"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-first">
  <h2 id="s-first">The first in its category: Next only, on the right</h2>
  <div data-mount="first"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-last">
  <h2 id="s-last">The last in its category: Previous only</h2>
  <div data-mount="last"></div>
</section>

<section class="cap-specimen" aria-labelledby="s-narrow">
  <h2 id="s-narrow">Phone width</h2>
  <div class="archive-narrow" data-mount="narrow"></div>
</section>
