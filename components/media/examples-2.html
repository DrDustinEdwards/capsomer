<script type="module">
  import { attachMedia } from "./media.ts";
  import { enhance as chips } from "../chips/chips.ts";
  import { enhance as bulk, bindBulk } from "../bulk-bar/bulk-bar.ts";
  import { enhance as drops } from "../drop-zone/drop-zone.ts";
  import { enhance as messages } from "../message/message.ts";

  // A save that takes a moment, and fails when the page says so (the tests set window.failSave).
  const save = (key, fields) =>
    new Promise((resolve, reject) =>
      setTimeout(() => (window.failSave ? reject(new Error("The server answered 502.")) : resolve()), 120),
    );
  window.saves = [];
  const recorded = (key, fields) => {
    window.saves.push({ key, fields });
    return save(key, fields);
  };

  messages();
  chips();
  drops();
  bulk();
  for (const el of document.querySelectorAll("#library, #narrow, #blank")) {
    const media = attachMedia(el, { save: recorded });
    const bar = document.getElementById(`${el.id}-bulk`);
    if (bar) bindBulk(bar, media.bulkHandlers());
    // Dropped files become uploading tiles, with progress that moves until they are done.
    el.addEventListener("cap-drop-accepted", (e) => {
      for (const file of e.detail.accepted) {
        const key = `media/${file.name}`;
        media.add({ key, name: file.name, url: `https://example.com/${key}`, kind: file.type.startsWith("image/") ? "image" : "document", type: file.type, bytes: file.size, alt: "", altState: "missing", title: "", caption: "", tags: [], used: [], state: "uploading", progress: 0 });
        let p = 0;
        const timer = setInterval(() => {
          p += 25;
          if (p >= 100) {
            clearInterval(timer);
            media.update(key, { state: "ready", progress: 100 });
          } else media.update(key, { progress: p });
        }, 300);
      }
    });
  }
</script>
