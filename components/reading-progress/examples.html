    <h1>Field notes</h1>
    <article data-cap-reading id="rp-article" style="padding-block-end: calc(10 * var(--space-9))">
      <p>The spring survey covered twelve sites along the creek, each visited once a week from March to May.</p>
      <p>Counts rose through April and fell in the first week of May, when the water was highest.</p>
      <p>Two sites were dry for most of March and are left out of the totals.</p>
      <p>The full counts, by site and by week, are in the annual report.</p>
      <p>Next season adds three sites upstream and moves the visits to Tuesdays.</p>
      <p>Thanks to Alex Rivera, Sam Lee and Jordan Park for the fieldwork.</p>
      <p>Questions go to the team at example.com.</p>
      <p>The method is the same as last year's, so the two seasons can be compared site by site.</p>
      <p>Weather notes for each visit are kept beside the counts.</p>
      <p>That is the whole of the spring.</p>
    </article>
