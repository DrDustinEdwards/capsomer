name: release

# A release is the merge of its version bump (CLAUDE.md, "Releases and deploys"). When package.json's
# version on main has no v<version> tag yet, this builds the package, tags a release commit made on
# top of that commit, publishes a GitHub release with the version's CHANGELOG section, and starts the
# consumer bumps. Nobody pushes a tag by hand.
#
# The release commit is main's tree plus the built dist/ and without the prepare script, and it is
# on no branch: an app that installs github:DrDustinEdwards/capsomer#vX.Y.Z gets the package as
# built, with no build at install time, so it installs none of Capsomer's devDependencies (two of
# them git dependencies, which npm 12 refuses without allow-git) and has no tsc run under its store.
#
# A tag made with the workflow's own token starts no other workflow (GitHub's rule against loops),
# so bump-consumers is called from here rather than left to its tag trigger. Run it by hand
# (Actions > release > Run workflow) to release a version that merged before this file existed.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and publish the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The version's own CHANGELOG section, from its heading to the next one.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section headed ## [$version]. Add it before bumping the version."
            exit 1
          fi
          # npm ci runs prepare, which builds dist/.
          npm ci
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); delete p.scripts.prepare; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          git add -f dist package.json
          git -c user.name="github-actions[bot]" -c user.email="41898341+github-actions[bot]@users.noreply.github.com" commit -q -m "Release $tag: the built package"
          git tag "$tag"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

  bump:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: DrDustinEdwards/devkit/.github/workflows/bump-consumers.yml@19a0131efae68afe76491545928f2f0dd366beca # v0.13.3
    with:
      dry_run: false
    secrets:
      token: ${{ secrets.RENOVATE_TRIGGER_TOKEN }}
