name: release

# The release job is devkit's release.yml (tag, release, attested tarball); this file is its caller.
#
# A release is the merge of its version bump (CLAUDE.md, "Releases and deploys"). When package.json's
# version on main has no v<version> tag yet, this builds the package, tags a release commit made on
# top of that commit, publishes a GitHub release with the version's CHANGELOG section, and starts the
# consumer bumps. Nobody pushes a tag by hand.
#
# The release commit is main's tree plus the built dist/ and without the prepare script, and it is
# on no branch: an app that installs github:DrDustinEdwards/capsomer#vX.Y.Z gets the package as
# built, with no build at install time, so it installs none of Capsomer's devDependencies (two of
# them git dependencies, which npm 12 refuses without allow-git) and has no tsc run under its store.
#
# A tag made with the workflow's own token starts no other workflow (GitHub's rule against loops),
# so bump-consumers is called from here rather than left to its tag trigger. Run it by hand
# (Actions > release > Run workflow) to release a version that merged before this file existed.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: DrDustinEdwards/devkit/.github/workflows/release.yml@5c808812e847316efbf6a4aea3b1074c6fd3c913 # v0.20.24
    with:
      build: true

  bump:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: DrDustinEdwards/devkit/.github/workflows/bump-consumers.yml@5c808812e847316efbf6a4aea3b1074c6fd3c913 # v0.20.24
    with:
      dry_run: false
    secrets:
      token: ${{ secrets.RENOVATE_TRIGGER_TOKEN }}
