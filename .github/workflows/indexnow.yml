name: indexnow

# After a push to main, Cloudflare Workers Builds deploys the site (DEPLOY.md). This waits until the key file
# (site/seo.ts, INDEXNOW_KEY) answers on the live site, then tells IndexNow with Prelum's prelum-indexnow and the
# live sitemap. A refused or failed ping is a warning, never a failure: the engines then crawl on their own schedule.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Tell IndexNow
        run: |
          origin=https://capsomer.dustinedwards.info
          key=$(sed -n 's/^export const INDEXNOW_KEY = "\(.*\)";$/\1/p' site/seo.ts)
          for i in $(seq 1 30); do curl -sf "$origin/$key.txt" >/dev/null && break; sleep 30; done
          # Give the build that is deploying this push time to finish, so the engines read the new page.
          sleep 180
          curl -sf "$origin/sitemap.xml" -o "$RUNNER_TEMP/sitemap.xml"
          prelum=$(node -p "require('./package.json').devDependencies['@drdustinedwards/site-helpers']")
          npx -y -p "$prelum" prelum-indexnow --origin "$origin" --key "$key" --sitemap "$RUNNER_TEMP/sitemap.xml"
