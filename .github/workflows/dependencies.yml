name: dependencies

# The caller a repository keeps. Replace the sha with the devkit commit that holds the reviewed dependencies.yml, and keep it
# a full sha: scripts/check-callers.mjs fails on anything else. The daily run is what finds an advisory published after a
# merge. Exceptions go in osv-scanner.toml at the repository root, each with its reason.

# The daily run alone: pr.yml scans every pull request, and a push run only repeats it (devkit README, "No second run on
# main").
on:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    uses: DrDustinEdwards/devkit/.github/workflows/dependencies.yml@4a2823d759785dc25a0d58c6243d97783d56e121 # v0.46.0
