name: scorecard

# OpenSSF Scorecard (area 12, C5): devkit's scorecard.yml publishes the score, uploads it to code scanning and fails when it
# falls below the last published one. Scorecard publishes only from the default branch, on a push or the schedule. Nightly,
# not on every push: a merge rarely moves the score (devkit README, "No second run on main"); a manual run scores at once.
# This file keeps no top-level env, defaults or write permissions, which the Scorecard API would refuse.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: DrDustinEdwards/devkit/.github/workflows/scorecard.yml@4a2823d759785dc25a0d58c6243d97783d56e121 # v0.46.0
