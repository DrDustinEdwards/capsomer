# The routine no-bloat checks (no-bloat/README.md). Two jobs. `no-bloat` is devkit's shared ratchet (Knip and jscpd
# against .no-bloat.json): a count above the baseline fails. A move to a newer devkit is a reviewed change to the sha and
# to the devDependency's tag together. `weight` is capsomer's own page weight and line counts, a report that never fails.
name: No bloat

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-bloat:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@454002f526e5e8e645a9c110605880e220b611a0 # v0.21.0
    with:
      node-version-file: .node-version
      install: npm ci --ignore-scripts

  weight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build the site, for the page-weight report
        run: npm run site
      - name: Page weight and lines, against the baseline
        run: |
          mkdir -p test-results
          npm run bloat >> "$GITHUB_STEP_SUMMARY"
