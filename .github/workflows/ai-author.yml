name: ai-author

# Devkit's gate that refuses an AI attribution trailer on a commit a push or pull request adds
# (and a commit authored or committed as Claude on a pull request). It runs the
# devkit-check-trailers bin from the devDependency's tag. The sha is the commit v0.6.0 points
# at: a full sha, which devkit's scripts/check-callers.mjs requires.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@27e0a1ca0747b5839bf7e0433c307ae671de8501 # v0.7.0
