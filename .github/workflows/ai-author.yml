name: ai-author

# Devkit's gate that refuses an AI attribution trailer on a commit a push or pull request adds
# (and a commit authored or committed as Claude on a pull request). It runs the
# devkit-check-trailers bin from the devDependency's tag. The sha is the commit v0.7.0 points
# at: a full sha, which devkit's scripts/check-callers.mjs requires.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@e99e4651b943f83b6591309b2151e7332786e64a # v0.20.2
